{% extends "base.html" %}

{% block page_content %}
<header>
<h1>Sumar Comenzi Clienti</h1>

<table class="table-bordered table-striped table-hover tabeldetaliat">
    <tr>
        <th>Nr.</th>
        <th>Client</th>
        <th>Data</th>
        <th>Tipuri produse comandate</th>
        <th>Pret total</th>
    </tr>
    {% for comanda in comenzi %}
        <tr>
            <td><a href="{{url_for('main.detalii_comanda_client', id=[comanda[0]])}}" target="_blank">{{ comanda[0] }}</a></td>
            <td>{{ comanda[1] }}</td>
            <td>{{ comanda[2].strftime("%Y-%m-%d %H:%M") }}</td>
            <td style="text-align: right">{{ comanda[3] }}</td>
            <td style="text-align: right">{{ comanda[4] }}</td>
        </tr>
    {% endfor %}
</table>

</header>
{% endblock %}
